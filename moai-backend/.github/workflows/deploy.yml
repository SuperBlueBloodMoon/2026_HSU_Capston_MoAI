name: MoAI Backend CI/CD

# 1. 언제 이 대본을 실행할 것인가? (트리거)
on:
  push:
    branches: [ "develop_merge" ]

# 2. 어떤 작업을 수행할 것인가? (작업 지시서)
jobs:
  build-and-push:
    runs-on: ubuntu-latest # 깃허브가 제공하는 최신 우분투 컴퓨터(무균실) 한 대를 빌림

    steps:
      # Step 1: 깃허브 컴퓨터에 내 코드 복사해오기
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: 자바 17 세팅하기 (우리가 도커에 썼던 temurin 버전)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Gradle 빌드해서 실행 가능한 jar 파일 만들기
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # Step 4: 도커 허브 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Step 5: 도커 이미지 굽고, 내 도커 허브 창고로 밀어 올리기(Push)
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/moai-backend:v1 .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/moai-backend:v1